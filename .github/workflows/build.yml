name: Build & release extension

# Runs only when a version tag (v*) is pushed. The tagged commit must be on main.
# Every run builds anvil-<tag>.vsix and attaches it to the GitHub Release for that tag.
# (Packaging is also validated on every push by the CI workflow.)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build .vsix and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build (production bundle)
        run: npm run build -- --production

      - name: Package extension
        run: |
          npm run package
          mv anvil.vsix "anvil-${GITHUB_REF_NAME}.vsix"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: anvil-vsix
          path: anvil-*.vsix
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "anvil-${GITHUB_REF_NAME}.vsix" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "anvil-${GITHUB_REF_NAME}.vsix" \
              --title "Anvil $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
