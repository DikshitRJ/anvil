version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major bumps need manual validation (@types/vscode must track engines.vscode).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # @types/vscode must match engines.vscode; bump both together by hand.
      - dependency-name: '@types/vscode'
      # @types/node tracks the oldest supported Node (20).
      - dependency-name: '@types/node'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
